name: modules
title: OpenShift — Base Lab
# Unversioned: showroom/nookbag requests pages without a version segment
# (/www/modules/index.html), so the component must not add a /<version>/ path.
version: ~
nav:
  - modules/ROOT/nav.adoc
asciidoc:
  attributes:
    page-pagination: true
    # Resolved at build time; override per-deployment as needed.
    guid: GUID
    domain: workshop.local
    # The Cluster Terminal shell runs as this unprivileged lab user.
    user: labuser
    page-links:
      - url: https://github.com/rhpds/showroom-troshka-ocp-base/issues/new
        text: Open an Issue (GitHub)
